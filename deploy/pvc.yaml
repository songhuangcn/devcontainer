apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-pvc
  labels:
    app: devcontainer
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
