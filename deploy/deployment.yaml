apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: devcontainer
spec:
  type: ClusterIP
  ports:
  - port: 4096
    targetPort: 4096
    name: opencode
  - port: 18789
    targetPort: 18789
    name: openclaw
  selector:
    app: devcontainer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: devcontainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devcontainer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: devcontainer
    spec:
      # local-path PV 是节点本地存储，固定调度到磁盘更宽裕的 arm1
      nodeSelector:
        kubernetes.io/hostname: arm1
      # 不用 fsGroup：它会递归放宽整个卷的权限（比如把 .ssh 私钥从 600 改成
      # 660），导致 ssh 客户端拒绝使用私钥。改用一次性 initContainer 只修 owner，
      # 不动权限位。
      initContainers:
      - name: fix-ownership
        image: busybox:1.36
        command: ["chown", "-R", "1000:1000", "/mnt/workspace", "/mnt/home-data"]
        volumeMounts:
        - name: workspace
          mountPath: /mnt/workspace
        - name: home-data
          mountPath: /mnt/home-data
      - name: configure-openclaw
        image: songhuangcn/devcontainer
        imagePullPolicy: Always
        command: ["openclaw"]
        args: ["config", "set", "gateway.controlUi.allowedOrigins", "[\"https://claw.hdgcs.com\"]"]
        volumeMounts:
        - name: home-data
          mountPath: /home/ubuntu/.openclaw
          subPath: .openclaw
      containers:
      - name: opencode
        image: songhuangcn/devcontainer
        imagePullPolicy: Always
        command: ["opencode"]
        args: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
        envFrom:
        - configMapRef:
            name: app-configmap
        - secretRef:
            name: app-secret
        ports:
        - containerPort: 4096
          name: opencode
        # 注意：设置了 OPENCODE_SERVER_PASSWORD 后 /global/health 也会要求 Basic Auth，
        # 探针拿不到密码会一直收到 401，所以用 tcpSocket 而不是 httpGet
        livenessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: home-data
          mountPath: /home/ubuntu/.agents
          subPath: .agents
        - name: home-data
          mountPath: /home/ubuntu/.cache
          subPath: .cache
        - name: home-data
          mountPath: /home/ubuntu/.claude
          subPath: .claude
        - name: home-data
          mountPath: /home/ubuntu/.codex
          subPath: .codex
        - name: home-data
          mountPath: /home/ubuntu/.config
          subPath: .config
        - name: home-data
          mountPath: /home/ubuntu/.copilot
          subPath: .copilot
        - name: home-data
          mountPath: /home/ubuntu/.lark-cli
          subPath: .lark-cli
        - name: home-data
          mountPath: /home/ubuntu/.multica
          subPath: .multica
        - name: home-data
          mountPath: /home/ubuntu/.npm
          subPath: .npm
        - name: home-data
          mountPath: /home/ubuntu/.ssh
          subPath: .ssh
        - name: home-data
          mountPath: /home/ubuntu/.vscode-server
          subPath: .vscode-server
        - name: home-data
          mountPath: /home/ubuntu/.claude.json
          subPath: .claude.json
        - name: home-data
          mountPath: /home/ubuntu/multica_workspaces
          subPath: multica_workspaces
        - name: home-data
          mountPath: /home/ubuntu/.openclaw
          subPath: .openclaw
        # 可提交的工具配置由根目录 kustomization 从 config/ 生成。
        - name: config-data
          mountPath: /home/ubuntu/.config/opencode/opencode.jsonc
          subPath: opencode.jsonc
        - name: config-data
          mountPath: /home/ubuntu/.gitconfig
          subPath: .gitconfig
        - name: config-data
          mountPath: /home/ubuntu/.claude/settings.json
          subPath: claude-settings.json
        - name: config-data
          mountPath: /home/ubuntu/.codex/config.toml
          subPath: codex-config.toml
      - name: openclaw
        image: songhuangcn/devcontainer
        imagePullPolicy: Always
        command: ["openclaw"]
        args: ["gateway", "--allow-unconfigured", "--bind", "lan", "--port", "18789", "--auth", "password"]
        env:
        - name: OPENCLAW_GATEWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: OPENCODE_SERVER_PASSWORD
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        ports:
        - containerPort: 18789
          name: openclaw
        livenessProbe:
          httpGet:
            path: /healthz
            port: 18789
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 18789
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: home-data
          mountPath: /home/ubuntu/.claude
          subPath: .claude
        - name: home-data
          mountPath: /home/ubuntu/.claude.json
          subPath: .claude.json
        - name: home-data
          mountPath: /home/ubuntu/.openclaw
          subPath: .openclaw
      - name: multica
        image: songhuangcn/devcontainer
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
        - >-
          until multica daemon start --foreground; do sleep 10; done
        env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - test -w /home/ubuntu/.multica
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
            cpu: "1"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: home-data
          mountPath: /home/ubuntu/.agents
          subPath: .agents
        - name: home-data
          mountPath: /home/ubuntu/.claude
          subPath: .claude
        - name: home-data
          mountPath: /home/ubuntu/.codex
          subPath: .codex
        - name: home-data
          mountPath: /home/ubuntu/.config
          subPath: .config
        - name: home-data
          mountPath: /home/ubuntu/.copilot
          subPath: .copilot
        - name: home-data
          mountPath: /home/ubuntu/.multica
          subPath: .multica
        - name: home-data
          mountPath: /home/ubuntu/.npm
          subPath: .npm
        - name: home-data
          mountPath: /home/ubuntu/.ssh
          subPath: .ssh
        - name: home-data
          mountPath: /home/ubuntu/multica_workspaces
          subPath: multica_workspaces
        - name: home-data
          mountPath: /home/ubuntu/.claude.json
          subPath: .claude.json
        - name: config-data
          mountPath: /home/ubuntu/.gitconfig
          subPath: .gitconfig
        - name: config-data
          mountPath: /home/ubuntu/.claude/settings.json
          subPath: claude-settings.json
        - name: config-data
          mountPath: /home/ubuntu/.codex/config.toml
          subPath: codex-config.toml
      # Docker-in-Docker sidecar：与应用容器共享同一个 Pod network namespace，
      # opencode、openclaw 和 multica 通过 DOCKER_HOST=tcp://localhost:2375 连接
      - name: dind
        image: docker:28-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: docker-data
          mountPath: /var/lib/docker
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspace-pvc
      - name: home-data
        persistentVolumeClaim:
          claimName: home-data-pvc
      - name: config-data
        configMap:
          name: config-data
      - name: docker-data
        persistentVolumeClaim:
          claimName: docker-data-pvc
