apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app: devcontainer
spec:
  type: ClusterIP
  ports:
  - port: 4096
    targetPort: 4096
    name: opencode
  selector:
    app: devcontainer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: devcontainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devcontainer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: devcontainer
    spec:
      # local-path PV 是节点本地存储，固定调度到磁盘更宽裕的 arm1
      nodeSelector:
        kubernetes.io/hostname: arm1
      # 不用 fsGroup：它会递归放宽整个卷的权限（比如把 .ssh 私钥从 600 改成
      # 660），导致 ssh 客户端拒绝使用私钥。这里只处理属主，不动权限位。
      initContainers:
      - name: fix-ownership
        image: busybox:1.36
        # 除了卷根目录，还要预建 config-data 那四条 subPath 挂载的父目录：
        # kubelet 会以 root 补出缺失的挂载点父目录，而它比镜像 ENTRYPOINT 的
        # devcontainer-home-init 更早，所以 /opt/home-skel 兜不住这一步——空卷
        # 首启时 .claude/.codex/.config/opencode 会变成 root 所有，容器里的
        # ubuntu 再也写不进自己的配置目录。其余目录仍由 home-init 负责。
        command:
        - sh
        - -c
        - |
          mkdir -p /mnt/user-data/.claude \
                   /mnt/user-data/.codex \
                   /mnt/user-data/.config/opencode
          chown 1000:1000 /mnt/workspace /mnt/user-data \
            /mnt/user-data/.claude /mnt/user-data/.codex \
            /mnt/user-data/.config /mnt/user-data/.config/opencode
        volumeMounts:
        - name: workspace
          mountPath: /mnt/workspace
        - name: user-data
          mountPath: /mnt/user-data
      containers:
      # 两个应用容器共享镜像、环境来源和持久化挂载；命令、探针和资源独立配置。
      - <<: &app-base
          image: songhuangcn/devcontainer
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: app-configmap
          - secretRef:
              name: app-secret
          volumeMounts:
          - name: workspace
            mountPath: /workspace
          # 整挂 home。必须排在下面四条 config-data 之前：kubelet 按声明顺序
          # 挂载，先挂子路径的话会被随后挂上的 /home/ubuntu 整个盖住。
          - name: user-data
            mountPath: /home/ubuntu
          # 可提交的工具配置由根目录 kustomization 从 config/ 生成。
          - name: config-data
            mountPath: /home/ubuntu/.gitconfig
            subPath: .gitconfig
          - name: config-data
            mountPath: /home/ubuntu/.claude/settings.json
            subPath: claude-settings.json
          - name: config-data
            mountPath: /home/ubuntu/.codex/config.toml
            subPath: codex-config.toml
          - name: config-data
            mountPath: /home/ubuntu/.config/opencode/opencode.jsonc
            subPath: opencode.jsonc
        name: opencode
        # 不要加 command：它会覆盖镜像 ENTRYPOINT，首启的 home 初始化就不跑了。
        args: ["opencode", "web", "--hostname", "0.0.0.0", "--port", "4096"]
        ports:
        - containerPort: 4096
          name: opencode
        # 注意：设置了 OPENCODE_SERVER_PASSWORD 后 /global/health 也会要求 Basic Auth，
        # 探针拿不到密码会一直收到 401，所以用 tcpSocket 而不是 httpGet
        livenessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 4096
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
      - <<: *app-base
        name: multica
        # 同上，不要加 command。
        args:
        - sh
        - -c
        - >-
          if ! multica auth status >/dev/null 2>&1; then
            multica login --token "$MULTICA_TOKEN";
          fi;
          exec multica daemon start --foreground
        env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        livenessProbe:
          exec:
            command: ["multica", "daemon", "status", "--output", "json"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
            cpu: "1"
      # Docker-in-Docker sidecar：与应用容器共享同一个 Pod network namespace，
      # opencode 和 multica 通过 DOCKER_HOST=tcp://localhost:2375 连接
      - name: dind
        image: docker:28-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: docker-data
          mountPath: /var/lib/docker
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspace-pvc
      - name: user-data
        persistentVolumeClaim:
          claimName: user-data-pvc
      - name: config-data
        configMap:
          name: config-data
      - name: docker-data
        persistentVolumeClaim:
          claimName: docker-data-pvc
