apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devcontainer
resources:
- namespace.yaml
- configmap.yaml
- app-sealed-secret.yaml
- pvc.yaml
- deployment.yaml
- ingress.yaml
configMapGenerator:
- name: config-data
  files:
  - opencode.jsonc=../config/opencode.jsonc
  - opencode-service.json=../config/opencode-service.json
  - .gitconfig=../config/.gitconfig
  - claude-settings.json=../config/claude-settings.json
  - codex-config.toml=../config/codex-config.toml
  - mise.toml=../config/mise.toml
- name: runtime-config
  literals:
  - RUNTIME_REVISION=main
images:
- name: songhuangcn/devcontainer
  newTag: latest
