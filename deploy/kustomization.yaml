apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devcontainer
resources:
- namespace.yaml
- configmap.yaml
- app-sealed-secret.yaml
- pvc.yaml
- deployment.yaml
- runtime-setup.yaml
- ingress.yaml
configurations:
- kustomizeconfig.yaml
configMapGenerator:
- name: runtime-config
  files:
  - sync-runtime.sh=../scripts/sync-runtime.sh
  literals:
  - RUNTIME_REVISION=__RUNTIME_REVISION__
  options:
    labels:
      devcontainer.hdgcs.com/deploy-phase: setup-input
images:
- name: songhuangcn/devcontainer
  newTag: latest
