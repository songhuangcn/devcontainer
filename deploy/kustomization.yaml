apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devcontainer
resources:
- namespace.yaml
- configmap.yaml
- app-sealed-secret.yaml
- pvc.yaml
- deployment.yaml
- ingress.yaml
- service-ssh.yaml
configMapGenerator:
- name: runtime-config
  files:
  - sync-runtime.sh=../scripts/sync-runtime.sh
  literals:
  - RUNTIME_REVISION=main
images:
- name: songhuangcn/devcontainer
  newTag: latest
