name: build-devcontainer

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile
      - docker-compose.yml
      - Makefile
      - README.md
      - scripts/**
      - tests/**
      - config/**
      - agents/**
      - deploy/**
      - .github/workflows/build-devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check base image changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - Dockerfile
              - .dockerignore
              - scripts/entrypoint.sh
              - .github/workflows/build-devcontainer.yml

      - name: Select image tag
        id: vars
        env:
          BUILD_IMAGE: ${{ steps.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$BUILD_IMAGE" = true ]; then
            echo "image_tag=commit-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            songhuangcn/devcontainer:${{ steps.vars.outputs.image_tag }}
            songhuangcn/devcontainer:latest

      - name: Verify runtime scripts
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}" make test

      - name: Verify runtime installation
        run: |
          IMAGE_TAG="${{ steps.vars.outputs.image_tag }}" make install.test

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Select base image and runtime revision
        run: |
          sed -i "s|newTag: .*|newTag: \"${{ needs.build.outputs.image_tag }}\"|g" deploy/kustomization.yaml
          sed -i "s|RUNTIME_REVISION=.*|RUNTIME_REVISION=${GITHUB_SHA}|" deploy/kustomization.yaml

      - name: Deploy to Kubernetes
        run: |
          make deploy.apply

      - name: Verify deployment
        run: |
          kubectl get pods -n devcontainer
          kubectl get svc -n devcontainer
