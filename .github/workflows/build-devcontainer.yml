name: build-devcontainer

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - mise.toml
      - Dockerfile
      - docker-compose.yml
      - Makefile
      - README.md
      - scripts/**
      - config/**
      - agents/**
      - deploy/**
      - .github/workflows/build-devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            songhuangcn/devcontainer:commit-${{ steps.vars.outputs.short_sha }}
            songhuangcn/devcontainer:latest

      - name: Verify runtime scripts
        run: |
          IMAGE_TAG="commit-${{ steps.vars.outputs.short_sha }}" make test

      - name: Verify runtime installation
        run: |
          docker run --pull always --rm \
            "songhuangcn/devcontainer:commit-${{ steps.vars.outputs.short_sha }}" \
            bash -eu -o pipefail -c '
              test ! -x "$MISE_INSTALL_PATH"
              cp -a /opt/agents/. "$HOME/.agents/"
              install.sh
              smoke-agent-cli-launchers
              test -r "$HOME/.claude/CLAUDE.md"
              test -d "$HOME/.claude/skills"
              docker compose version
              mise exec -- python -c "import defusedxml, jsonschema, numpy, pypdf, pymupdf, yaml, requests, ruamel.yaml, urllib3"
            '

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Update image tag in kustomization
        run: |
          sed -i "s|newTag: .*|newTag: \"commit-${{ needs.build.outputs.short_sha }}\"|g" deploy/kustomization.yaml

      - name: Deploy to Kubernetes
        run: |
          make deploy.apply

      - name: Verify deployment
        run: |
          kubectl get pods -n devcontainer
          kubectl get svc -n devcontainer
