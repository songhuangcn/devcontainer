# 合并到默认分支后自动部署，并把结果通知 Planner（Multica 的“部署结果” autopilot）。
# 受 CODEOWNERS 保护，只能由人批准修改。
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read    # make deploy 只用 gh 查询构建工作流的运行结果
  deployments: read
  actions: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      # make deploy 只等 build-devcontainer*.yml 的镜像构建（gh 在 runner 上自带，GH_TOKEN 见下）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml==6.0.2

      # 约定：make deploy 要等线上版本接口返回本次 GITHUB_SHA 再返回（带超时），
      # 否则下面通知 Planner 时线上还是旧版本。见 docs/setup/repo.md
      - name: deploy
        run: make deploy
        env:
          GH_TOKEN: ${{ github.token }}

      # 有新上线任务或触及规则文件才通知 Planner，避免空部署唤醒 Planner
      - name: notify planner
        if: always()
        env:
          HOOK: ${{ secrets.MULTICA_DEPLOY_HOOK }}
          SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KEY: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::没有设置 secret MULTICA_DEPLOY_HOOK，跳过通知 Planner"
            exit 0
          fi
          if ! issues=$(bash .autoteam/scripts/deployed-issues.sh deploy "$SHA"); then
            echo "::warning::计算部署任务清单失败"
            exit 1
          fi
          echo "部署任务清单: $issues"
          if ! sync=$(bash .autoteam/scripts/deployed-issues.sh rules "$SHA"); then
            echo "::warning::判断规则文件改动失败"
            exit 1
          fi
          if [ "$issues" = '[]' ] && [ "$sync" != true ]; then
            echo "没有相关任务，跳过通知 Planner"
            exit 0
          fi
          jq -n --arg kind deploy --arg sha "$SHA" --arg result "$RESULT" --arg repo "$REPO" --arg run_url "$RUN_URL" --argjson issues "$issues" --argjson sync "$sync" \
            '{kind: $kind, sha: $sha, result: $result, repo: $repo, run_url: $run_url, issues: $issues, sync_instructions: $sync}' \
            | curl -fsS -X POST "$HOOK" -H 'Content-Type: application/json' \
                -H "Idempotency-Key: $KEY" --data-binary @- \
            || echo "::warning::通知 Planner 失败，巡检会补查待上线的任务"
