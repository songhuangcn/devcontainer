# autoteam 配置。autoteam 和 agent 都会读这个文件，受 CODEOWNERS 保护。
# 格式：每行 KEY=VALUE，# 开头是注释；不支持行尾注释和变量展开。

# GitHub 仓库（owner/name）和默认分支
AUTOTEAM_REPO=songhuangcn/devcontainer
AUTOTEAM_DEFAULT_BRANCH=main

# 人类负责人的 GitHub 用户名：写进 CODEOWNERS，规则文件只能由他批准修改
AUTOTEAM_OWNER=songhuangcn

# 三个 GitHub App 的 App ID。Implementer 和 Reviewer 必须是不同的 App：GitHub 不允许
# PR 作者批准自己的 PR，两个不同身份才能让"写代码的不能评审自己"由平台保证。
# autoteam github --create-apps 可通过 Manifest 流程创建 App，安装仍需人确认，私钥放 .autoteam/local/<角色>.pem。
AUTOTEAM_IMPLEMENTER_APP_ID=5011663
AUTOTEAM_REVIEWER_APP_ID=5011589
AUTOTEAM_PLANNER_APP_ID=5011610
# 有意让三个 App 服务同组织多个仓库时，逐个核对安装范围与权限后设为 on。
# on 表示接受私钥泄露时可触及安装范围内所有仓库的风险；github 不再重复提醒。
AUTOTEAM_APP_ALL_REPOS_ACK=on

# App 私钥找不到时的兜底目录（机器上的固定位置，~ 按运行的那台机器展开）。
# 顺序：AUTOTEAM_<角色>_APP_KEY 指的路径 > 仓库里的 .autoteam/local/ > 这里。
# agent 每次 checkout 都是新目录，私钥只放仓库里就要跟着重放一遍，所以给它一个固定位置
AUTOTEAM_KEYS_DIR=~/.keys

# Multica 工作区 slug、项目标题
AUTOTEAM_MULTICA_WORKSPACE=hdgcs
AUTOTEAM_MULTICA_PROJECT=devcontainer
# 负责批准任务、接收升级的成员名（Multica 里的显示名）；留空表示运行 autoteam 的人
AUTOTEAM_HUMAN=Song
# agent 的调用权限：private（只有创建者能触发）或 workspace（工作区成员都能触发）
AUTOTEAM_AGENT_ACCESS=private
# 任务编号前缀（Multica 工作区的 issue prefix）
AUTOTEAM_ISSUE_PREFIX=HDGCS

# 必需检查的名字，要和 gate.yml 里的 job 名一致
AUTOTEAM_CHECK_NAME=check
# 单个 PR 的改动行数上限（gate.yml 在运行时读取）
AUTOTEAM_PR_MAX_LINES=400

# Planner 自主放行（backlog → todo）：on 时，满足 planner.md「放行分级」全部条件的任务
# 由 Planner 自己放行，其余仍由人批准；off 时一律由人批准
AUTOTEAM_AUTO_APPROVE=off
# 过去 24 小时最多自主放行几个任务，超出的留在 backlog 等下次有名额
AUTOTEAM_AUTO_APPROVE_MAX_PER_DAY=5

# 防止来回打转：同一个 PR 的打回上限、同一个任务的验收不通过上限，到了就升级给人
AUTOTEAM_MAX_REVIEW_REJECTIONS=2
AUTOTEAM_MAX_ACCEPTANCE_FAILURES=2

# 同一个任务换几次 Implementer 之后升级给人
AUTOTEAM_MAX_IMPLEMENTER_SWITCHES=1

# 已合并的任务超过几小时还没验收，巡检就补查一次（部署通知可能因为 runtime 离线被跳过）
AUTOTEAM_ACCEPT_RECHECK_HOURS=1

# 代码健康指标默认看多少天
AUTOTEAM_METRICS_DAYS=30

# 不计入 PR 行数上限的路径（逗号分隔，git pathspec 的 glob）。
# 规则文件由人批准，本来就不该占 agent 的行数预算
AUTOTEAM_PR_SIZE_EXCLUDE=**/*.lock,**/package-lock.json,**/pnpm-lock.yaml,**/go.sum,**/*.md,.github/**,.autoteam/**

# 部署用的 GitHub environment；GitHub Free 的私有仓库不支持，留空
AUTOTEAM_DEPLOY_ENVIRONMENT=production

# autopilot 定时触发的时区
AUTOTEAM_TIMEZONE=Asia/Shanghai

# 新项目只创建这些 autopilot（包内文件名，逗号分隔）。已有但未列入的仍会更新，
# 不会删除或暂停；要保留就加上，不要就到 Multica 界面删除。
AUTOTEAM_AUTOPILOTS=deploy-result,patrol,daily-digest,rule-review,health

# agent 的评论、PR 标题和描述、提交信息、任务描述使用的语言（代码标识符、命令、日志原文除外）。
# 取值写自然语言标识，如 zh-CN、en、ja；改完 autoteam multica --apply 同步到各 agent 的指令前言
AUTOTEAM_LANGUAGE=zh-CN

# 各 autopilot 的定时（五段 cron，时区按上面）。改完直接 autoteam multica --apply 同步，
# 不用重新渲染任何文件
AUTOTEAM_CRON_PATROL=0 */2 * * *
AUTOTEAM_CRON_DAILY_DIGEST=0 9 * * *
AUTOTEAM_CRON_HEALTH=0 9 * * 1
AUTOTEAM_CRON_DIRECTION=0 11 1 * *
AUTOTEAM_CRON_RULE_REVIEW=0 12 * * 1

# 是否因命中 CODEOWNERS 将任务升级给人。off 表示不升级，规则集也不要求 Code Owner 审批；
# 本仓库与 autoteam 一致，不启用 codeowner，Reviewer 批准即可合并。
AUTOTEAM_CODEOWNERS_GATE=off

# 共享团队仓库（owner/name）；空表示本仓库管理 agent，成员仓库只同步项目和 autopilot
AUTOTEAM_TEAM_HOME=autoteam-ai/autoteam
