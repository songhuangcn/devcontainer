name: workspace-devcontainer
services:
  app:
    # 默认拉取预构建镜像；改 Dockerfile 后用 `make build`(devcontainer build) 本地构建同名镜像。
    image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - songhuangcn/devcontainer:latest
    env_file:
      - .env
    # docker-in-docker feature 在容器内启动 dockerd，需要特权模式与 init 进程。
    privileged: true
    init: true
    # ports:
    #   - "4096:4096"
    volumes:
      - ..:/workspace
      # 整个 ubuntu 用户目录由本地 ./data 持久化；initializeCommand 会先从镜像合并缺失文件。
      - ./data:/home/ubuntu
      # 持久化容器内 Docker 镜像/容器数据（替代原 dind sidecar 的 docker-data 卷）。
      - docker-data:/var/lib/docker

volumes:
  docker-data:
