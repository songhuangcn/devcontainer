name: workspace-devcontainer

x-app-base: &app-base
  # 默认拉取预构建镜像；改 Dockerfile 后用 `make build` 本地构建同名镜像。
  image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
  build: .
  env_file:
    - .env
  environment:
    DOCKER_HOST: tcp://docker:2375
  init: true
  restart: unless-stopped
  volumes:
      - ..:/workspace
      # 整挂用户 home。镜像自带的工具链装在 /opt（mise、agent CLI、home skel），
      # 不会被这个卷遮住；新增工具不再需要在这里补挂载。
      - ./data:/home/ubuntu
      # 可提交的工具配置覆盖 data 中对应文件；登录态和历史数据仍保存在 data。
      # 这四条是 /home/ubuntu 的嵌套挂载，父目录必须已存在于 ./data，否则由
      # Docker daemon 以 root 创建，容器内的 ubuntu 用户就写不进去（`make setup`）。
      - ./config/.gitconfig:/home/ubuntu/.gitconfig
      - ./config/claude-settings.json:/home/ubuntu/.claude/settings.json
      - ./config/codex-config.toml:/home/ubuntu/.codex/config.toml
      - ./config/opencode.jsonc:/home/ubuntu/.config/opencode/opencode.jsonc

services:
  opencode:
    <<: *app-base
    command: ["opencode", "web", "--hostname", "0.0.0.0", "--port", "${OPENCODE_PORT:-4096}"]
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${OPENCODE_PORT:-4096}/global/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  multica:
    <<: *app-base
    environment:
      DOCKER_HOST: tcp://docker:2375
      # daemon ID 是服务端 runtime 的去重键；复用原 ID 可保留已有 agent 绑定。
      MULTICA_DAEMON_ID: ${MULTICA_DAEMON_ID:-019fffb2-a6d0-7045-8ff5-9b73fe675dd1}
      MULTICA_DAEMON_DEVICE_NAME: ${MULTICA_DAEMON_DEVICE_NAME:-devcontainer.local}
    command:
      - sh
      - -c
      - >-
        if ! multica auth status >/dev/null 2>&1; then
          multica login --token "$${MULTICA_TOKEN}";
        fi;
        exec multica daemon start --foreground
    healthcheck:
      test: ["CMD", "multica", "daemon", "status", "--output", "json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ..:/workspace
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docker-data:
