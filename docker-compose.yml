name: workspace-devcontainer

x-app-base: &app-base
  # 默认拉取预构建镜像；改 Dockerfile 后用 `make build` 本地构建同名镜像。
  image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
  build: .
  # 固定 hostname，而不是让每个容器各拿一个随机的 Docker 短 ID。app/opencode/
  # multica 共享同一份 home/workspace，本就是同一个"机器"身份；multica 在
  # MULTICA_DAEMON_DEVICE_NAME 未设置时会读 os.Hostname() 当默认值（已读源码
  # 验证：server/internal/daemon/config.go 的 `deviceName := envOrDefault(
  # "MULTICA_DAEMON_DEVICE_NAME", host)`），固定 hostname 后不用再单独配置。
  hostname: devcontainer-local
  env_file:
    - .env
  environment:
    DOCKER_HOST: tcp://docker:2375
  init: true
  restart: unless-stopped
  volumes:
      - ..:/workspace
      # 整挂用户 home。镜像自带的工具链装在 /opt（mise、agent CLI、home skel），
      # 不会被这个卷遮住；新增工具不再需要在这里补挂载。
      - ./data:/home/ubuntu
      # 可提交的工具配置覆盖 data 中对应文件；登录态和历史数据仍保存在 data。
      # 这几条是 /home/ubuntu 的嵌套挂载，父目录必须已存在于 ./data，否则由
      # Docker daemon 以 root 创建，容器内的 ubuntu 用户就写不进去（`make setup`）。
      - ./config/.gitconfig:/home/ubuntu/.gitconfig
      - ./config/claude-settings.json:/home/ubuntu/.claude/settings.json
      - ./config/codex-config.toml:/home/ubuntu/.codex/config.toml
      - ./config/opencode.jsonc:/home/ubuntu/.config/opencode/opencode.jsonc
      # 关掉 OpenCode 2.x 的常驻后台服务，`opencode run`/TUI 改为各自带一个私有
      # 子进程服务器（同 1.x 的进程模型）。原因见 README「OpenCode」一节。
      - ./config/opencode-service.json:/home/ubuntu/.config/opencode/service.json

services:
  # 默认的通用工作容器：跟 opencode 服务隔离开，不带 opencode 专属的端口/健康
  # 检查。启动 sshd 作为前台进程，提供一个可以从宿主机 SSH 进来的共享
  # home/workspace 入口（host key 持久化在 ./data，见 scripts/start-sshd.sh）。
  app:
    <<: *app-base
    command: ["devcontainer-start-sshd"]
    ports:
      - "${SSH_PORT:-2222}:22"
  opencode:
    <<: *app-base
    # 2.x 去掉了 `opencode web`，Web UI 由 `opencode serve` 一并提供。
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "${OPENCODE_PORT:-4096}"]
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    healthcheck:
      # 2.x 的所有接口（含 /api/info）都要 Basic Auth，密码取自 .env 的
      # OPENCODE_SERVER_PASSWORD；没配密码时 serve 每次启动随机生成，这里会一直不健康。
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:$${OPENCODE_PORT:-4096}/api/info >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  multica:
    <<: *app-base
    environment:
      DOCKER_HOST: tcp://docker:2375
      # daemon ID 是服务端 runtime 的去重键；复用原 ID 可保留已有 agent 绑定。
      MULTICA_DAEMON_ID: ${MULTICA_DAEMON_ID:-019fffb2-a6d0-7045-8ff5-9b73fe675dd1}
    command:
      - sh
      - -c
      - >-
        if ! multica auth status >/dev/null 2>&1; then
          multica login --token "$${MULTICA_TOKEN}";
        fi;
        exec multica daemon start --foreground
    healthcheck:
      test: ["CMD", "multica", "daemon", "status", "--output", "json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ..:/workspace
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docker-data:
