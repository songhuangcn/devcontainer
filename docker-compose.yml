name: workspace-devcontainer
services:
  app:
    # 默认拉取预构建镜像；改 Dockerfile 后用 `make build` 本地构建同名镜像。
    image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
    build: .
    env_file:
      - .env
    environment:
      DOCKER_HOST: tcp://docker:2375
    # depends_on:
    #   docker:
    #     condition: service_healthy
    init: true
    # ports:
    #   - "4096:4096"
    #   - "2222:2222"
    volumes:
      - ..:/workspace
      # 整个 ubuntu 用户目录由本地 ./data 持久化；首次使用前运行 `make setup` 合并镜像内缺失文件。
      - ./data:/home/ubuntu
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ..:/workspace
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docker-data:
