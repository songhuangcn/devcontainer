name: workspace-devcontainer

x-app-base: &app-base
  # 默认拉取预构建镜像；改 Dockerfile 后用 `make build` 本地构建同名镜像。
  image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
  build: .
  # 纯粹让容器内 `hostname` 好认；不用于任何服务的身份识别（那部分见下面
  # DEVICE_NAME 的说明）。k8s 侧 Pod hostname 不允许带点，所以这里也统一用
  # 连字符形式，本地和云端两边风格一致。
  hostname: devcontainer-local
  env_file:
    - .env
  environment:
    DOCKER_HOST: tcp://docker:2375
  init: true
  restart: unless-stopped
  volumes:
      - ..:/workspace
      # 整挂用户 home。镜像自带的工具链装在 /opt（mise、agent CLI、home skel），
      # 不会被这个卷遮住；新增工具不再需要在这里补挂载。
      - ./data:/home/ubuntu
      # 可提交的工具配置覆盖 data 中对应文件；登录态和历史数据仍保存在 data。
      # 这四条是 /home/ubuntu 的嵌套挂载，父目录必须已存在于 ./data，否则由
      # Docker daemon 以 root 创建，容器内的 ubuntu 用户就写不进去（`make setup`）。
      - ./config/.gitconfig:/home/ubuntu/.gitconfig
      - ./config/claude-settings.json:/home/ubuntu/.claude/settings.json
      - ./config/codex-config.toml:/home/ubuntu/.codex/config.toml
      - ./config/opencode.jsonc:/home/ubuntu/.config/opencode/opencode.jsonc

services:
  opencode:
    <<: *app-base
    command: ["opencode", "web", "--hostname", "0.0.0.0", "--port", "${OPENCODE_PORT:-4096}"]
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${OPENCODE_PORT:-4096}/global/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  multica:
    <<: *app-base
    environment:
      DOCKER_HOST: tcp://docker:2375
      # daemon ID 是服务端 runtime 的去重键；复用原 ID 可保留已有 agent 绑定。
      MULTICA_DAEMON_ID: ${MULTICA_DAEMON_ID:-019fffb2-a6d0-7045-8ff5-9b73fe675dd1}
      # DEVICE_NAME 是这台本地实例统一的名字，claude service 的会话名前缀也读
      # 同一个变量——不要用容器默认 hostname（Docker 默认取随机容器 ID，每次
      # 重建都变，见 x-app-base 的说明）。
      MULTICA_DAEMON_DEVICE_NAME: ${DEVICE_NAME:-devcontainer.local}
    command:
      - sh
      - -c
      - >-
        if ! multica auth status >/dev/null 2>&1; then
          multica login --token "$${MULTICA_TOKEN}";
        fi;
        exec multica daemon start --foreground
    healthcheck:
      test: ["CMD", "multica", "daemon", "status", "--output", "json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  claude:
    <<: *app-base
    environment:
      # environment 会整段覆盖 x-app-base 的 environment（YAML merge key 不做
      # 深合并），必须像 multica 一样重复写 DOCKER_HOST，否则会静默丢失。
      DOCKER_HOST: tcp://docker:2375
      # 和 multica 共用同一个 DEVICE_NAME，避免两处分别配置。
      CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX: ${DEVICE_NAME:-devcontainer.local}
    # 没有类似 multica 的"先查状态再登录"步骤——full-scope 登录只能靠交互式
    # claude auth login（见 README），没法脚本化判断。登录/信任弹窗做完之前
    # 直接退出即可，交给 x-app-base 的 restart: unless-stopped 兜底重启。
    command: ["claude", "remote-control"]
  docker:
    image: docker:28-dind
    privileged: true
    hostname: devcontainer-local
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ..:/workspace
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docker-data:
