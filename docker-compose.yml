name: workspace-devcontainer

x-app-base: &app-base
  # 默认拉取预构建镜像；改 Dockerfile 后用 `make build` 本地构建同名镜像。
  image: ${IMAGE_NAME:-songhuangcn/devcontainer}:${IMAGE_TAG:-latest}
  build: .
  # 固定 hostname，而不是让每个容器各拿一个随机的 Docker 短 ID。app/opencode/
  # multica 共享同一份 home/workspace，本就是同一个"机器"身份；multica 在
  # MULTICA_DAEMON_DEVICE_NAME 未设置时会读 os.Hostname() 当默认值（已读源码
  # 验证：server/internal/daemon/config.go 的 `deviceName := envOrDefault(
  # "MULTICA_DAEMON_DEVICE_NAME", host)`），固定 hostname 后不用再单独配置。
  hostname: devcontainer-local
  env_file:
    - .env
  environment:
    DOCKER_HOST: tcp://docker:2375
  init: true
  restart: unless-stopped
  volumes:
      # 仓库位于 /workspace/.devcontainer，脚本直接从这里执行，无需重复挂载。
      - ..:/workspace
      # 整挂用户 home，mise 和工具链在启动后装到卷中，由所有应用容器共享。
      - ./data:/home/ubuntu
      # start.sh 将用户配置和 .agents 链接到工作区中的可写仓库，修改双向同步。

services:
  # 默认的通用工作容器：跟 opencode 服务隔离开，不带 opencode 专属的端口/健康
  # 检查。启动 sshd 作为前台进程，提供一个可以从宿主机 SSH 进来的共享
  # home/workspace 入口（host key 持久化在 ./data，见 scripts/start-sshd.sh）。
  app:
    <<: *app-base
    command: ["bash", "/workspace/.devcontainer/scripts/start.sh", "bash", "/workspace/.devcontainer/scripts/start-sshd.sh"]
    ports:
      - "${SSH_PORT:-2222}:22"
  opencode:
    <<: *app-base
    # 2.x 去掉了 `opencode web`，Web UI 由 `opencode serve` 一并提供。
    command: ["bash", "/workspace/.devcontainer/scripts/start.sh", "bash", "-lc", "exec mise exec -- opencode serve --hostname 0.0.0.0 --port ${OPENCODE_PORT:-4096}"]
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    healthcheck:
      # 2.x 的所有接口（含 /api/info）都要 Basic Auth，密码取自 .env 的
      # OPENCODE_SERVER_PASSWORD；没配密码时 serve 每次启动随机生成，这里会一直不健康。
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:$${OPENCODE_PORT:-4096}/api/info >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
  multica:
    <<: *app-base
    environment:
      DOCKER_HOST: tcp://docker:2375
      # daemon ID 是服务端 runtime 的去重键；复用原 ID 可保留已有 agent 绑定。
      MULTICA_DAEMON_ID: ${MULTICA_DAEMON_ID:-019fffb2-a6d0-7045-8ff5-9b73fe675dd1}
    command:
      - bash
      - /workspace/.devcontainer/scripts/start.sh
      - bash
      - -lc
      - exec mise exec -- bash /workspace/.devcontainer/scripts/start-multica.sh
    healthcheck:
      test: ["CMD", "/home/ubuntu/.local/bin/multica", "daemon", "status", "--output", "json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  docker:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - ..:/workspace
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docker-data:
